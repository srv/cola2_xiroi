# Enbale thrusters
enable_thrusters: false

# Maximum velocity for each DOF
max_velocity_x: 0.7
max_velocity_y: 0.0
max_velocity_z: 0.0
max_velocity_roll: 0.0
max_velocity_pitch: 0.0
max_velocity_yaw: 0.45

# Set zero velocity parameters
set_zero_velocity_depth: 1.0
set_zero_velocity_axes: [true, false, true, false, false, true]


# POSE PID CONTROLLER
# The following parameters adjust the proportional–integral–derivative
# controllers for each degree of freedom (DOF). i_limit represents the maximum
# value the integral part can take (anti-windup), and fff allows a feed-forward
# force to be specified (sometimes useful for the heave controller)
p_surge_kp: 0.0
p_surge_ti: 0.0
p_surge_td: 0.0
p_surge_i_limit: 0.0
p_surge_fff: 0.0

p_sway_kp: 0.0
p_sway_ti: 0.0
p_sway_td: 0.0
p_sway_i_limit: 0.0
p_sway_fff: 0.0

p_heave_kp: 1.2
p_heave_ti: 0.0
p_heave_td: 0.0
p_heave_i_limit: 0.0
p_heave_fff: 0.0

p_roll_kp: 0.0
p_roll_ti: 0.0
p_roll_td: 0.0
p_roll_i_limit: 0.0
p_roll_fff: 0.0

p_pitch_kp: 0.0
p_pitch_ti: 0.0
p_pitch_td: 0.0
p_pitch_i_limit: 0.0
p_pitch_fff: 0.0

p_yaw_kp: 2.5
p_yaw_ti: 0.0
p_yaw_td: 0.0
p_yaw_i_limit: 0.0
p_yaw_fff: 0.0


# Twist (velocity) PID controller
t_surge_kp: 0.25
t_surge_ti: 20.0
t_surge_td: 0.0
t_surge_i_limit: 0.25
t_surge_fff: 0.0

t_sway_kp: 0.0
t_sway_ti: 0.0
t_sway_td: 0.0
t_sway_i_limit: 1.0
t_sway_fff: 0.0

# t_heave_kp: 0.75
# t_heave_ti: 5.0
# t_heave_td: 0.0
# t_heave_i_limit: 0.15
# t_heave_fff: 0.1

t_heave_kp: 3.0
t_heave_ti: 20.0
t_heave_td: 0.0
t_heave_i_limit: 0.1
t_heave_fff: 0.05

t_roll_kp: 0.0
t_roll_ti: 0.0
t_roll_td: 0.0
t_roll_i_limit: 1.0
t_roll_fff: 0.0

t_pitch_kp: 0.0
t_pitch_ti: 0.0
t_pitch_td: 0.0
t_pitch_i_limit: 1.0
t_pitch_fff: 0.0

t_yaw_kp: 2.5
t_yaw_ti: 8.0
t_yaw_td: 0.0
t_yaw_i_limit: 0.15
t_yaw_fff: 0.0


# Parameters for a feed-forward polynomial model for each DOF (A+B*x+C*x^2)
poly_surge_A: 0.0
poly_surge_B: 0.0
poly_surge_C: 25.0

poly_sway_A: 0.0
poly_sway_B: 0.0
poly_sway_C: 0.0

poly_heave_A: 0.0
poly_heave_B: 4.0
poly_heave_C: 250.0

poly_roll_A: 0.0
poly_roll_B: 0.0
poly_roll_C: 0.0

poly_pitch_A: 0.0
poly_pitch_B: 0.0
poly_pitch_C: 0.0

poly_yaw_A: 0.0
poly_yaw_B: 0.0
poly_yaw_C: 10.8


# Maximum wrench (force) for each DOF
max_wrench_X: 154.0
max_wrench_Y: 0.0
max_wrench_Z: 30.0
max_wrench_Roll: 3.66
max_wrench_Pitch: 17.15
max_wrench_Yaw: 14.43
