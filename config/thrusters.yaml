# port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A6008ipb-if00-port0
port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A9007KY9-if00-port0
baud: 57600
timeout: 0.5
rate: 50
base_frame: base_link
#Thrusters pins
left_thruster_pin: 1
right_thruster_pin: 0

#Current sensor parameters
current_sensor_pin_left: 0
current_sensor_pin_right: 1
current_sensor_buffer_size: 90
current_sensor_left_power_pin: 13
#Relay parameters
usbl_pin: 2
usbl_relay_power_pin: 3
#Setpoints ramp
activate_ramp: true
rising_rate: 0.65
falling_rate: 0.95
setpoint_limit: 0.75

#Thruster characteristics
zero_pwm: 1500
max_pwm: 1800 # 1900 MAX 
