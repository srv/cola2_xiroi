# imu_angle_estimator.py config file
imu_topic: "sensors/imu_raw_filtered"
mag_topic: "sensors/imu_mag_filtered"
max_gyro_bias_buffer_size: 18000  # Max size of the averaging filter. Must be an integer greater than zero
min_gyro_bias_buffer_size: 250  # Min size of the averaging filter. Representative of initial waiting time. Must be an integer greater than zero
filter_divergence_buffer_size: 1000  # Size of the buffer used to check divergence
acceleration_limit: 0.20  # Acceleration limit in m/s^2 to start applying filter_reduction_factor
rates_limit: 0.5  # Rates limit in rad/s to start applying filter_reduction_factor
filter_reduction_factor: 0.5  # From 0.0 (no tilt angles when limits is reached) to 1.0 (limits don't matter)
pub_topic: "sensors/imu_angle_estimator"
frame_id: "xiroi/base_link"
angle_covariance: 0.1
angular_velocity_covariance: 0.1
acceleration_covariance: 0.1
declination: 0.06981317  # This value is ADDED to the yaw output of the filter
calibration_file_path: "/home/xiroi/calibrations"
merging_filter_coefficient: 0.996 # Recomended settings: Pool -> 0.95    Sea -> 0.995 to 0.998