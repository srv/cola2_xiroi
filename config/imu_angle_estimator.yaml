
# imu_angle_estimator.py config file
imu_angle_estimator/imu_topic: "sensors/imu_raw_driver"
imu_angle_estimator/mag_topic: "sensors/mag_raw_driver"
imu_angle_estimator/max_gyro_bias_buffer_size: 18000  # Max size of the averaging filter. Must be an integer greater than zero
imu_angle_estimator/min_gyro_bias_buffer_size: 250  # Min size of the averaging filter. Representative of initial waiting time. Must be an integer greater than zero
imu_angle_estimator/filter_divergence_buffer_size: 1000  # Size of the buffer used to check divergence
imu_angle_estimator/acceleration_limit: 0.20  # Acceleration limit in m/s^2 to start applying filter_reduction_factor
imu_angle_estimator/rates_limit: 0.5  # Rates limit in rad/s to start applying filter_reduction_factor
imu_angle_estimator/filter_reduction_factor: 0.5  # From 0.0 (no tilt angles when limits is reached) to 1.0 (limits don't matter)
imu_angle_estimator/pub_topic: "sensors/imu_raw"
imu_angle_estimator/frame_id: "xiroi/imu"
imu_angle_estimator/angle_covariance: 0.1
imu_angle_estimator/angular_velocity_covariance: 0.1
imu_angle_estimator/acceleration_covariance: 0.1
imu_angle_estimator/declination: 0.06981317  # This value is ADDED to the yaw output of the filter
imu_angle_estimator/calibration_file_path: "/home/eric-uib"

imu_angle_estimator/merging_filter_coefficient: 0.995 # Recomended settings: Pool -> 0.95    Sea -> 0.995 to 0.998

# Calibracio portixol
imu_angle_estimator/soft_iron: [[1.27744897866, 0.135470746997, 0.0], [0.135470746997, 1.06614666012, 0.0], [0.0, 0.0, 1.0]]
imu_angle_estimator/hard_iron: [[-422.058560963], [-447.339854777], [0.0]]
