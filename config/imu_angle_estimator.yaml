# Path where the configuration of the "imu_angle_estimator" node is available
imu_angle_estimator/configuration_package: "cola2_sparus2"

# Path where some visual calibration outputs are stored
imu_angle_estimator/calibration_file_path: "/home/cirs/"

# From 0.0 (only tilt angles) to 1.0 (only gyro).
# Recomended settings: Pool -> 0.95    Sea -> 0.995 to 0.998
imu_angle_estimator/merging_filter_coefficient: 0.995

# Max size of the averaging filter that estimates the gyro biases. Must be an
# integer greater than zero
imu_angle_estimator/max_gyro_bias_buffer_size: 18000

# The output data is represented with respect to the "imu_filter" frame but
# orientated in the vehicle frame. This "trick" is necessary for calibration
# purposes (since the calibration is performed in 2D)
imu_angle_estimator/frame_id: "imu_filter"

# Transformation with respect to the vehicle frame: [x, y, z, roll, pitch, yaw]
# in meters and degrees
imu_angle_estimator/tf: [0.36377, -0.02093, -0.08490, 90.0, 0.0, 90.0]

# At the end of the path, new calibrations can be appended
imu_angle_estimator/soft_iron: [[1.04447897427, 1.8970670000e-19, -0.00309824736558],
  [1.8970670000e-19, 1.0, -1.321429e-20], [-0.00309824736558, -1.321429e-20, 1.00021581291]]
