# Data frame (will be composed with the robot name)
teledyne_explorer_dvl/frame_id: "dvl"

# Serial port configuration
teledyne_explorer_dvl/serial_port/path: "/dev/ttyS5"
teledyne_explorer_dvl/serial_port/baud_rate: 115200
teledyne_explorer_dvl/serial_port/char_size: 8
teledyne_explorer_dvl/serial_port/stop_bits: 1
teledyne_explorer_dvl/serial_port/parity: "NONE"
teledyne_explorer_dvl/serial_port/flow_control: "NONE"
teledyne_explorer_dvl/serial_port/timeout: 3000 # be aware that the answer of the DVL to a stop command (+++) is not instantaneous.

# DVL Configuration
# The following parameters will be updated only if they are different form the
# ones already loaded in the DVL
# Please see the vendor manual for details of each parameter.
teledyne_explorer_dvl/save_to_sensor_memory: false
teledyne_explorer_dvl/retrieve_parameters: "0" # 0 User, 1 Factory
teledyne_explorer_dvl/serial_port_control: "811"
teledyne_explorer_dvl/flow_control: "11010"
teledyne_explorer_dvl/bottom_track_pings_per_ensemble: "1"
teledyne_explorer_dvl/evaluation_amplitude_minimum: "024" # Range from 1 to 255
teledyne_explorer_dvl/maximum_tracking_depth: "01000" # units decimeters. Range from 0 to 65535dm
teledyne_explorer_dvl/heading_alignment: "+00000" # units centidegrees. If the ExplorerDVL is rotated +45 degrees starboard, set EA to EA+04500
teledyne_explorer_dvl/transducer_depth: "00001" # units decimeters. Range from 0 to 65535dm
teledyne_explorer_dvl/salinity: "35" # Parts per thousand. Range from 0 to 40
teledyne_explorer_dvl/coordinate_transformation: "01111"
teledyne_explorer_dvl/sensor_source: "00000000"
teledyne_explorer_dvl/temperature: "1000" # units centidegrees. Range -0500 (-5º) to +4000 (40º)
teledyne_explorer_dvl/sound_speed: 1500 # from 1400 to 1600 m/s
teledyne_explorer_dvl/time_per_ensemble: "00:00:00.00" # hours:minutes:seconds.100th of seconds
teledyne_explorer_dvl/time_between_pings: "00:00.00" # minutes:seconds.100th of seconds
teledyne_explorer_dvl/water_mass_layer_mode: "1"
teledyne_explorer_dvl/water_mass_layer_parameters: "0001,0010,0070" # min size (dm),near(dm),far(dm) -> min layer size 0.1m near layer size 1m far layer boundary 7m
teledyne_explorer_dvl/environmental_data_output: "0000010"
teledyne_explorer_dvl/heading_bias: "+00000"
teledyne_explorer_dvl/sensor_source_override_for_doppler_parameters: "0 0 0 0 0 0\
  \ 0 0"
teledyne_explorer_dvl/data_stream_select: "6"

# DVL Uncertainty
teledyne_explorer_dvl/bottom_covariance: [0.002, 0.002, 0.002]
teledyne_explorer_dvl/water_covariance: [0.1, 0.1, 0.1]
