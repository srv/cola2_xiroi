# Request information feedback from the drivers (currents, voltages, rpms...)
actuators_485/thrusters/request_info: true

# Maximum allowed setpoint change between iterations
actuators_485/thrusters/max_step: 0.1

# If true the max_step is also used when reducing speed
actuators_485/thrusters/symmetric: true

# Information for each thruster. Each phisical driver has an address. The sign
# vector allows changing the direction of rotation. The limiter parameter
# sets the maximum allowed setpoint to be sent to the thruster. The order is:
# vertical, right (starboard), left (port)
actuators_485/thrusters/addresses: [164, 10, 80]
actuators_485/thrusters/signs: [1, -1, 1]
actuators_485/thrusters/limiter: [0.6, 1.0, 1.0]

# Serial port
actuators_485/sp_baud_rate: 57600
actuators_485/sp_path: "/dev/ttyS7"
actuators_485/sp_char_size: 8
actuators_485/sp_stop_bits: 1
actuators_485/sp_parity: "NONE"
actuators_485/sp_flow_control: "NONE"
