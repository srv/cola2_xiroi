# Determine the publish rate of the diagnostics aggregator
pub_rate: 2.0

# The following parameters are used to categorize the data from the diagnostics
# in order to display the desired hierarchy in the robot_monitor tool
base_path: ''
analyzers:
  safety:
    type: GenericAnalyzer
    path: safety
    name: [
      'emus_bms',
      'batteries',
      'pc_cylinder',
      'virtual_cage',
      'safe_depth_altitude',
      'cola2_watchdog',
      'safety_supervisor',
      'evologics_modem',
      'vehicle_status_parser',
      'computer_logger',
      'main_control_board']

  navigation:
    type: GenericAnalyzer
    path: navigation
    name: [
      'pressure',
      'imu',
      'gps',
      'dvl',
      'navigator'
      ]

  control:
    type: GenericAnalyzer
    path: control
    name: [
      'controller',
      'teleoperation',
      'captain',
      'joystick: Joystick Driver Status']
