# Determine the publish rate of the diagnostics aggregator
pub_rate: 2.0

# The following parameters are used to categorize the data from the diagnostics
# in order to display the desired hierarchy in the robot_monitor tool
base_path: ''
analyzers:
  safety:
    type: GenericAnalyzer
    path: safety
    name: [
      'emus_bms',
      'virtual_cage',
      'safe_depth_altitude',
      'cola2_watchdog',
      'safety_supervisor',
      'evologics_modem',
      'vehicle_status_parser',
      'computer_logger',
      'battery_control_board',
      's2_mon_control_board']

  navigation:
    type: GenericAnalyzer
    path: navigation
    name: [
      'nmea_gps',
      'teledyne_explorer_dvl',
      'adis_imu',
      'navigator'
      ]

  control:
    type: GenericAnalyzer
    path: control
    name: [
      'controller',
      'teleoperation',
      'captain',
      'joystick: Joystick Driver Status']
