evologics:
    set_initialization_params: True
    driver:
        physical_interface_timeout: 0.1
        response_timeout: 1.5
        modem_pos_timeout: 0.2
        wait_for_service: True
        service_name: '/xiroi/usbl_on'
    acoustic:
        source_level: 3 # [0 (max) ->  3 (min)]
        gain: 1 # 0 normal gain, 1 low gain
        cluster_size: 5 # [1,255] lower value (less than 10) for communications between moving objects.
        packet_time: 400 # [50,1000]ms Shorter Packet Time is recommended for challenging hydroacoustic channels with highly dynamic parameters.
        im_retry_count: 5
        retry_count: 5 # [1,255] number of connection establishment retries.
        retry_timeout: 1000 # [500,12000]ms Range operation 750m * 2 /  1500m/s * 1000 = 1000ms
    usbl:
        interface: 'TCP'
        address: ['192.168.1.245', 9200]
        id: 1
        loop_period: 0.02 # Look for new acoustic messages
        source_level_control: 0
        carrier_waveform: 0
    modem:
        interface: 'serial'
        address: ['/dev/ttyS11', 19200]
        id: 2
        loop_period: 0.5 # Get new nav_sts for the pbm
        source_level_control: 1
        carrier_waveform: 1